{% extends "webapp/base.html" %}
{% block title %}{{ t.title }}{% endblock %}

{% block content %}
<h1>{{ t.title }}</h1>
<p class="sub">{{ t.subtitle }}</p>

<div class="field">
  <label for="ttn">{{ t.ttn_label }}</label>
  <input type="text" id="ttn" autocomplete="off" placeholder="{{ t.ttn_placeholder }}" maxlength="64">
  <div class="error" id="ttn-error">{{ t.ttn_error }}</div>
</div>

<div class="field">
  <label for="text">{{ t.text_label }}</label>
  <textarea id="text" placeholder="{{ t.text_placeholder }}" maxlength="4000"></textarea>
  <div class="error" id="text-error">{{ t.text_error }}</div>
</div>

<button class="submit" id="submit">{{ t.submit }}</button>
{% endblock %}

{% block script %}
<script>
  const ttn = document.getElementById('ttn');
  const text = document.getElementById('text');
  const button = document.getElementById('submit');

  button.addEventListener('click', function () {
    const ttnValue = ttn.value.trim();
    const textValue = text.value.trim();
    document.getElementById('ttn-error').style.display = ttnValue ? 'none' : 'block';
    document.getElementById('text-error').style.display = textValue ? 'none' : 'block';
    if (!ttnValue || !textValue) return;
    submitForm({ ttn_number: ttnValue, text: textValue }, button);
  });
</script>
{% endblock %}
