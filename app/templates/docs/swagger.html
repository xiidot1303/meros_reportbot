<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MerosPharm API — Swagger UI</title>
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; background: #fafafa; }
  .docs-nav {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: #1b1b1d; color: #fff;
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .docs-nav strong { font-weight: 600; margin-right: auto; }
  .docs-nav a { color: #9ecbff; text-decoration: none; }
  .docs-nav a:hover, .docs-nav a:focus { text-decoration: underline; }
  .docs-nav a.active { color: #fff; font-weight: 600; }
  .swagger-ui .topbar { display: none; }
</style>
</head>
<body>
<nav class="docs-nav">
  <strong>MerosPharm Integration API</strong>
  <a class="active" href="/api/docs/">Swagger UI</a>
  <a href="/api/reference/">Stoplight</a>
  <a href="/api/schema/">openapi.json</a>
</nav>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
<script>
  window.ui = SwaggerUIBundle({
    url: "/api/schema/",
    dom_id: "#swagger-ui",
    deepLinking: true,
    persistAuthorization: true,
    displayRequestDuration: true,
    defaultModelsExpandDepth: -1,
    tryItOutEnabled: true,
    presets: [SwaggerUIBundle.presets.apis],
  });
</script>
</body>
</html>
