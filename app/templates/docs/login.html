<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MerosPharm API — Вход в документацию</title>
<style>
  :root {
    --bg: #f4f4f2; --card: #ffffff; --ink: #17181b; --ink-2: #5c626b;
    --rule: #dcdcd8; --accent: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131418; --card: #1c1e23; --ink: #e9eaec; --ink-2: #a2a8b2;
      --rule: #2e313a; --accent: #e8963f; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--rule); border-radius: 12px; padding: 32px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .brand {
    font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  h1 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.01em; }
  p.sub { margin: -12px 0 0; color: var(--ink-2); font-size: 14px; }
  form { display: flex; flex-direction: column; gap: 14px; }
  label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  input[type=text], input[type=password] {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    color: var(--ink); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 8px; outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 11px; font-size: 15px; font-weight: 600; font-family: inherit;
    color: #fff; background: var(--accent); border: none; border-radius: 8px; cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  .error {
    padding: 10px 12px; border-radius: 8px; font-size: 13.5px;
    color: var(--bad); border: 1px solid var(--bad); background: transparent;
  }
  .foot { margin: 0; font-size: 12.5px; color: var(--ink-2); }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">MerosPharm</div>
    <h1>Документация API</h1>
    <p class="sub">Войдите, чтобы открыть документацию.</p>

    {% if access_error %}
      <div class="error">{{ access_error }}</div>
    {% elif form.errors %}
      <div class="error">Неверное имя пользователя или пароль.</div>
    {% endif %}

    <form method="post" action="">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}">
      <div>
        <label for="id_username">Имя пользователя</label>
        <input type="text" name="username" id="id_username" autocomplete="username" autofocus required>
      </div>
      <div>
        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password" autocomplete="current-password" required>
      </div>
      <button type="submit">Войти</button>
    </form>

    <p class="foot">Доступ к документации выдаётся отдельно от доступа в админ-панель.</p>
  </div>
</body>
</html>
