;; PgBouncer for the MerosPharm client cabinet.
;; Django connects here instead of Postgres (DB_PORT=6432, DB_POOL_MODE=transaction).

[databases]
;; Replace <db_name>/<db_user>/<db_password> to match .env.
;; PgBouncer authenticates to Postgres itself, so the credentials live here too.
<db_name> = host=127.0.0.1 port=5432 dbname=<db_name>

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432

;; transaction mode: a server connection is returned to the pool after each
;; transaction, so a handful of real Postgres backends serve every worker.
;; Requires DISABLE_SERVER_SIDE_CURSORS=True on the Django side (already set).
pool_mode = transaction

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Sizing for this app's four processes (gunicorn, uvicorn/bot, jobs, celery).
;; default_pool_size is per (user, database) pair — the number of REAL Postgres
;; connections. Keep it well under Postgres's max_connections (default 100).
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

;; Recycle server connections so a long-lived pool can't accumulate stale state.
server_lifetime = 3600
server_idle_timeout = 600

;; Fail fast rather than hanging a request when the pool is exhausted.
query_wait_timeout = 10

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
admin_users = <db_user>
